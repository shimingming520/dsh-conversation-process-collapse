# Bundle patch layer for the standalone plugin: the row loads the package's
# main entry as the host half (a plain Cordis plugin); the `dsh.client`
# declaration makes the web app load its ./client bundle as the browser half.
# This is the pure-DOM build: it does not require the upstream
# conversation.chat.processGroup extension point.
- insert:
    - id: ui-turn-process-collapse
      name: 'dsh-conversation-process-collapse'
